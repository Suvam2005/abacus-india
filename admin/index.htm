    <!DOCTYPE html>
    <html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sip Dashboard</title>
        <!-- Style Sheet b -->
        <link rel="stylesheet" href="assets/css/style.css">
    </head>

    <body>
        <div class="container">
            <div class="navigation">
                <ul>
                    <li>
                        <a href="#">
                            <span class="icon">
                                <i class="fa-solid fa-code-branch"></i>
                            </span>
                            <span class="title">SIP Abacus</span>
                        </a>
                    </li>

                    <li>
                        <a href="#">
                            <span class="icon">
                                <i class="fa-solid fa-money-bill"></i>
                            </span>
                            <span class="title">Add Money</span>
                        </a>
                    </li>

                    <li>
                        <a href="#">
                            <span class="icon">
                                <i class="fa-solid fa-user-plus"></i>
                            </span>
                            <span class="title">Add Student</span>
                        </a>
                    </li>

                    <li>
                        <a href="#">
                            <span class="icon">
                                <i class="fa-solid fa-list"></i>
                            </span>
                            <span class="title">Student List</span>
                        </a>
                    </li>

                    <li>
                        <a href="#">
                            <span class="icon">
                                <i class="fa-solid fa-certificate"></i>
                            </span>
                            <span class="title">Certificate</span>
                        </a>
                    </li>

                    <li>
                        <a href="#">
                            <span class="icon">
                                <i class="fa-solid fa-gear"></i>
                            </span>
                            <span class="title">Settings</span>
                        </a>
                    </li>

                    <li>
                        <a href="#">
                            <span class="icon">
                                <i class="fa-solid fa-right-from-bracket"></i>
                            </span>
                            <span class="title">Sign Out</span>
                        </a>
                    </li>

                </ul>
            </div>

            <!-- Main  -->
            <div class="main">
                <div class="topbar">

                    <div class="toggle">
                        <i class="fa-solid fa-bars"></i> <!-- menu icon -->
                    </div>

                    <div class="search">
                        <label>
                            <i class="fa-solid fa-magnifying-glass"></i> <!-- search icon -->
                            <input type="text" placeholder="Search Bar">
                        </label>
                    </div>

                    <div class="user">
                        <i class="fa-solid fa-user"></i> <!-- user icon -->
                        <!-- OR image -->
                        <img src="user.jpg" alt="userImage">
                    </div>

                </div>
            </div>


        </div>
        <script src="assets/js/main.js"></script>


    </body>


    </html>
